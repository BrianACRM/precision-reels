<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mower Inventory Admin</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Precision Reels secure listing dashboard." />
    <meta name="theme-color" content="#101812" />
    <link rel="preconnect" href="https://ddomhyyhixovprojozvy.supabase.co" crossorigin />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./admin.css?v=no-focus-zoom-1" />
  </head>
  <body>
    <main class="login-shell" id="loginShell" hidden>
      <form class="login-card" id="loginForm">
        <img class="admin-logo" src="./assets/logo-900.webp" alt="Precision Reels" />
        <p>Secure admin</p>
        <h1>Sign in</h1>
        <label>Email <input name="email" type="email" autocomplete="username" required /></label>
        <label>Password <input name="password" type="password" autocomplete="current-password" required /></label>
        <button type="submit">Login</button>
        <span class="form-note" id="loginMessage"></span>
      </form>
    </main>

    <main class="admin-shell" id="adminShell" hidden>
      <header class="admin-header">
        <div>
          <img class="admin-logo" src="./assets/logo-900.webp" alt="Precision Reels" />
          <p>Inventory admin</p>
          <h1>Mower listings</h1>
        </div>
        <nav class="admin-nav">
          <a href="./">View website</a>
          <button id="logoutButton" type="button">Logout</button>
        </nav>
      </header>

      <section class="admin-board">
        <form class="listing-form" id="listingForm">
          <div class="form-heading">
            <span>Add mower</span>
            <strong id="formModeLabel">New listing</strong>
          </div>
          <p class="form-note">Secure listings save to Supabase after login.</p>

          <label class="make-field">
            Make
            <select name="make" required>
              <option value="Jacobsen">Jacobsen</option>
              <option value="Toro">Toro</option>
              <option value="John Deere">John Deere</option>
              <option value="Other">Other</option>
            </select>
          </label>

          <label>
            Model
            <input name="model" type="text" placeholder="PGM22 Walk Reel" required />
          </label>

          <label>
            Year
            <input name="year" type="text" placeholder="2017" required />
          </label>

          <label>
            Price
            <input name="price" type="text" placeholder="$4,850" required />
          </label>

          <label>
            Specs
            <textarea name="specs" placeholder="22 inch walk-behind reel mower. Includes catcher and transport wheels." required></textarea>
          </label>

          <label>
            Stock #
            <input name="stock" type="text" placeholder="PR-017" />
          </label>

          <label class="image-drop">
            <input id="imageInput" type="file" accept="image/*" multiple />
            <img id="imagePreview" alt="" />
            <span id="imagePrompt">Add photos</span>
          </label>
          <div class="image-strip" id="imageStrip" aria-label="Selected image previews"></div>

          <div class="form-actions">
            <button id="submitListingButton" type="submit">Add listing</button>
            <button id="cancelEditButton" type="button" hidden>Cancel edit</button>
          </div>
        </form>

        <section class="inventory-admin" aria-label="Current listings">
          <div class="section-bar">
            <div>
              <span>Current listings</span>
              <strong id="listingCount">0 active</strong>
            </div>
          </div>

          <div class="admin-grid" id="adminGrid"></div>
        </section>
      </section>
    </main>

    <template id="listingTemplate">
      <article class="admin-card" tabindex="0">
        <button class="remove-button" type="button" aria-label="Remove listing">X</button>
        <img class="card-image" alt="" />
        <div class="card-copy">
          <h2></h2>
          <dl class="card-fields"></dl>
        </div>
      </article>
    </template>

    <dialog class="listing-dialog" id="listingDialog">
      <button class="dialog-close" type="button" aria-label="Close listing">X</button>
      <div class="dialog-viewer">
        <img id="dialogMainImage" alt="" />
      </div>
      <div class="dialog-gallery" id="dialogGallery"></div>
      <div>
        <h2 id="dialogTitle"></h2>
        <dl class="dialog-fields" id="dialogFields"></dl>
        <div class="dialog-actions">
          <button id="editListingButton" type="button">Edit listing</button>
        </div>
      </div>
    </dialog>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="./supabase-config.js"></script>
    <script src="./supabase-client.js"></script>
    <script src="./admin.js?v=no-focus-zoom-1"></script>
    <script src="./pwa.js?v=pwa-1"></script>
  </body>
</html>
