<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Precision Reels</title>
    <meta name="description" content="Contact Precision Reels about used walk-behind greens mowers, inventory questions, pickup, and shipping." />
    <link rel="canonical" href="https://precisionreels.com/contact.html" />
    <meta property="og:title" content="Contact Precision Reels" />
    <meta property="og:description" content="Ask Precision Reels about used walk-behind greens mowers, current inventory, pickup, and shipping." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://precisionreels.com/contact.html" />
    <meta property="og:image" content="https://precisionreels.com/assets/logo-1200.png" />
    <meta name="theme-color" content="#101812" />
    <link rel="preload" as="image" href="./assets/logo-900.webp" type="image/webp" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="contact-shell">
      <header class="contact-header">
        <picture>
          <source srcset="./assets/logo-900.webp" type="image/webp" />
          <img class="contact-logo" src="./assets/logo-900.png" alt="Precision Reels" width="900" height="212" />
        </picture>
        <h1>Contact Precision Reels</h1>
      </header>

      <section class="contact-layout">
        <form class="contact-form" id="contactForm">
          <h2>Send an email</h2>
          <p class="form-context">Questions about inventory, buying or selling reel mowers, pickup, shipping, or a specific stock number.</p>
          <label>
            Name
            <input name="name" type="text" placeholder="Your name" required />
          </label>
          <label>
            Phone or email
            <input name="contact" type="text" placeholder="Best way to reach you" required />
          </label>
          <label>
            Subject
            <input name="subject" type="text" placeholder="Mower inquiry" required />
          </label>
          <label>
            Message
            <textarea name="message" placeholder="Tell Precision Reels what you are looking for." required></textarea>
          </label>
          <button type="submit">Contact Precision Reels</button>
        </form>
      </section>
      <footer class="site-footer">
        <span>Davis Turf and Tool LLC</span>
        <a href="./">Back to inventory</a>
      </footer>
    </main>

    <script src="./contact.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((registrations) => {
          registrations.forEach((registration) => registration.unregister());
        });
      }
    </script>
  </body>
</html>
